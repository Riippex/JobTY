name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: back/requirements-test.txt

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check back/app/ back/tests/

  backend-tests:
    name: Backend behavior tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: back/requirements-test.txt

      - name: Install test dependencies
        run: pip install -r back/requirements-test.txt

      - name: Run pytest
        working-directory: back
        run: pytest -v

  frontend-build:
    name: Frontend lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: front

      - name: Lint
        run: npm run lint
        working-directory: front

      - name: Frontend unit tests
        run: npm test
        working-directory: front

      - name: Typecheck
        run: npx tsc --noEmit --incremental false
        working-directory: front

      - name: Build
        run: npm run build
        working-directory: front
